<svg width="260" height="180" viewBox="0 0 260 180" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Manali Trails emblem logo</title>
<desc>A rounded glass badge containing layered translucent mountain peaks and a compass point, with a stacked sans-serif wordmark below</desc>
<defs>
<linearGradient id="badgeBg" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#1e3a8a"/>
<stop offset="100%" stop-color="#0e7490"/>
</linearGradient>
<linearGradient id="peakA" x1="0%" y1="100%" x2="100%" y2="0%">
<stop offset="0%" stop-color="#22d3ee" stop-opacity="0.9"/>
<stop offset="100%" stop-color="#22d3ee" stop-opacity="0.35"/>
</linearGradient>
<linearGradient id="peakB" x1="0%" y1="100%" x2="100%" y2="0%">
<stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
<stop offset="100%" stop-color="#ffffff" stop-opacity="0.25"/>
</linearGradient>
</defs>

<rect x="66" y="4" width="128" height="128" rx="28" fill="url(#badgeBg)"/>
<rect x="66" y="4" width="128" height="128" rx="28" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5"/>

<circle cx="130" cy="46" r="5" fill="#fbbf24"/>
<line x1="130" y1="34" x2="130" y2="40" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
<line x1="130" y1="52" x2="130" y2="58" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.5"/>
<line x1="114" y1="46" x2="120" y2="46" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.5"/>
<line x1="140" y1="46" x2="146" y2="46" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.5"/>

<path d="M78 112 L106 66 L128 96 L148 72 L182 112 Z" fill="url(#peakB)"/>
<path d="M78 112 L118 58 L158 112 Z" fill="url(#peakA)"/>
<path d="M118 58 L131 78 L105 78 Z" fill="#ffffff" fill-opacity="0.95"/>

<line x1="66" y1="112" x2="194" y2="112" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1"/>

<text x="130" y="156" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#0f172a" text-anchor="middle" letter-spacing="4">MANALI</text>
<text x="130" y="174" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#0891b2" text-anchor="middle" letter-spacing="6">TRAILS</text>
</svg>
